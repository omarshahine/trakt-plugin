name: Publish to NPM

on:
  push:
    tags:
      - "v*"
  # push.yml dispatches this after semantic-release cuts a tag. A tag created
  # with GITHUB_TOKEN does not fire `push: tags`, so without this an automated
  # release publishes nothing.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish trakt-tools to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Print npm version
        # Bundled npm in node 22 (10.9+) supports `--provenance` natively.
        # Avoid `npm install -g npm@latest`: the bundled npm's self-upgrade path
        # is broken on current runner images with `Cannot find module 'promise-retry'`.
        run: npm --version

      - name: Sync manifest version to tag (tag is source of truth)
        # semantic-release tags the commit but does not write
        # openclaw/package.json, so the manifest lags on an automated release.
        # Matches what publish-clawhub.yml already does.
        run: |
          V="${GITHUB_REF_NAME#v}"
          for f in package.json openclaw.plugin.json .claude-plugin/plugin.json; do
            [ -f "$f" ] || continue
            node -e "const fs=require('fs'),p='$f',j=JSON.parse(fs.readFileSync(p));if('version' in j){j.version='$V';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('synced '+p+' -> $V')}"
          done
          echo "VERSION=$V" >> "$GITHUB_ENV"
        working-directory: openclaw

      - name: Install + build (compile TS so publish has dist/)
        run: |
          cd openclaw
          npm install
          npm run build

      - name: Publish to NPM (OIDC trusted publishing)
        run: npm publish --provenance --access public
        working-directory: openclaw

      - name: Verify
        run: |
          sleep 10
          PUBLISHED=$(npm view trakt-tools version)
          echo "npm reports $PUBLISHED (expected $VERSION)"
          [ "$PUBLISHED" = "$VERSION" ] || { echo "::error::npm still on $PUBLISHED"; exit 1; }
