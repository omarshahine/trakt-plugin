name: Publish to ClawHub

on:
  push:
    tags:
      - "v*"
  # Dispatched by push.yml after semantic-release; a GITHUB_TOKEN tag does not
  # fire `push: tags`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to ClawHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clawhub CLI
        run: npm install -g clawhub

      - name: Authenticate
        run: clawhub login --token "${{ secrets.CLAWHUB_TOKEN }}" --no-browser

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog from tag annotation
        id: changelog
        run: |
          MSG=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -z "$MSG" ] || [ "$MSG" = "$GITHUB_REF_NAME" ]; then
            MSG=$(git log -1 --format='%s')
          fi
          echo "text=$MSG" >> "$GITHUB_OUTPUT"

      - name: Install + build (compile TS so clawhub validator finds dist/)
        run: |
          cd openclaw
          npm install
          npm run build

      - name: Sync manifest version to tag (tag is source of truth)
        run: |
          cd openclaw
          V="${{ steps.version.outputs.version }}"
          for f in package.json openclaw.plugin.json .claude-plugin/plugin.json; do
            [ -f "$f" ] || continue
            node -e "const fs=require('fs'),p='$f',j=JSON.parse(fs.readFileSync(p));if('version' in j){j.version='$V';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('synced '+p+' -> $V')}"
          done

      - name: Publish to ClawHub
        run: |
          clawhub package publish openclaw \
            --family code-plugin \
            --name trakt-tools \
            --display-name Trakt \
            --version "${{ steps.version.outputs.version }}" \
            --changelog "${{ steps.changelog.outputs.text }}" \
            --tags "latest" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref_name }}" \
            --source-path openclaw

      - name: Verify
        # `clawhub package inspect` prints whatever is currently PUBLIC and
        # always exits 0. ClawHub publishing is async -- the publish step
        # reports "Update submitted ... pending security scans before it
        # becomes public" -- so immediately after publishing this printed the
        # PREVIOUS version and passed. It could not tell a successful publish
        # from a failed one. Poll until the expected version goes public.
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            PUBLISHED=$(clawhub package inspect trakt-tools 2>/dev/null               | sed -n 's/^Latest:[[:space:]]*//p' | head -1)
            echo "attempt $attempt: ClawHub reports '${PUBLISHED:-unknown}' (expecting $EXPECTED)"
            if [ "$PUBLISHED" = "$EXPECTED" ]; then
              echo "ClawHub published $EXPECTED"
              exit 0
            fi
            sleep 30
          done
          echo "::error::ClawHub never published $EXPECTED (still on '${PUBLISHED:-unknown}' after 10 minutes)."
          echo "::error::A publish can sit in security scanning; re-check before assuming failure."
          exit 1
