name: Push workflow

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - linux
          - darwin
          - windows
          - freebsd
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run build
        run: go build -o trakt-cli-$GOOS-$GOARCH
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build binary
        run: go build -o trakt-cli .
      - name: Run tests
        run: go test ./... -v -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint Commit
        uses: wagoid/commitlint-github-action@v3

  release:
    name: Publish new release
    needs: [build, test, lint, commitlint]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          npx semantic-release
          git fetch --tags
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$before" != "$after" ]; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "new_tag=$after" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch latest tag
        if: steps.semantic.outputs.new_release == 'true'
        run: |
          git checkout "${{ steps.semantic.outputs.new_tag }}"
      - name: Run GoReleaser
        if: steps.semantic.outputs.new_release == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish OpenClaw plugin to NPM
        if: steps.semantic.outputs.new_release == 'true'
        working-directory: openclaw
        run: |
          npm ci
          npm version $(git describe --tags --abbrev=0 | sed 's/^v//') --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish OpenClaw plugin to ClawHub
        if: steps.semantic.outputs.new_release == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.semantic.outputs.new_tag }}
        run: |
          npx clawhub auth login --token "$CLAWHUB_TOKEN" --no-browser

          VERSION=$(node -p "require('./openclaw/package.json').version")
          COMMIT=$(git rev-parse HEAD)

          # Pull changelog from the GitHub Release that semantic-release
          # just created. Falls back to a generic message if the release
          # body isn't available yet (race with GitHub API propagation).
          CHANGELOG=$(gh release view "$RELEASE_TAG" --json body -q '.body' 2>/dev/null \
            | head -c 4000 || echo "Release $VERSION")

          npx clawhub package publish openclaw \
            --family code-plugin \
            --name "trakt-tools" \
            --display-name "Trakt" \
            --version "$VERSION" \
            --changelog "$CHANGELOG" \
            --tags "latest" \
            --source-repo "omarshahine/trakt-plugin" \
            --source-commit "$COMMIT" \
            --source-ref "main" \
            --source-path "openclaw"
