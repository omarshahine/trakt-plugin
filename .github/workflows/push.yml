name: Push workflow

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - linux
          - darwin
          - windows
          - freebsd
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run build
        run: go build -o trakt-cli-$GOOS-$GOARCH
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build binary
        run: go build -o trakt-cli .
      - name: Run tests
        run: go test ./... -v -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint Commit
        uses: wagoid/commitlint-github-action@v3

  release:
    name: Publish new release
    needs: [build, test, lint, commitlint]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          npx semantic-release
          git fetch --tags
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$before" != "$after" ]; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "new_tag=$after" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch latest tag
        if: steps.semantic.outputs.new_release == 'true'
        run: |
          git checkout "${{ steps.semantic.outputs.new_tag }}"
      - name: Run GoReleaser
        if: steps.semantic.outputs.new_release == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NPM and ClawHub are published by publish-npm.yml / publish-clawhub.yml,
      # which npm's trusted publisher is bound to (the provenance attestation
      # for 1.9.3 names .github/workflows/publish-npm.yml). Publishing from
      # this workflow could never work: npm rejects OIDC from an unexpected
      # workflow, and the old NODE_AUTH_TOKEN path failed with a misleading
      # `E404 PUT https://registry.npmjs.org/trakt-tools`.
      #
      # Those workflows trigger on `push: tags`, which GitHub does NOT fire for
      # a tag created with GITHUB_TOKEN -- so an automated semantic-release
      # tag silently published nothing. Dispatch them explicitly instead.
      - name: Publish plugin to NPM + ClawHub
        if: steps.semantic.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.semantic.outputs.new_tag }}"
          gh workflow run publish-npm.yml --ref "$TAG"
          gh workflow run publish-clawhub.yml --ref "$TAG"
          echo "Dispatched publish workflows for $TAG"
